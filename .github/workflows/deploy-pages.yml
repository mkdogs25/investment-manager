name: Deploy frontend to GitHub Pages

# The app runs entirely in the browser: it calls the public NAV API directly and
# builds the .xlsx client-side, so GitHub Pages hosting it is self-sufficient —
# there is no backend to deploy and nothing to configure.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch is published, whatever it happens to be called.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Typecheck and build
        working-directory: frontend
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA and Jekyll fallbacks
        working-directory: frontend/dist
        # .nojekyll stops Pages stripping files that begin with an underscore;
        # 404.html makes deep links fall back to the app shell.
        run: |
          touch .nojekyll
          cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
